<div class="user-list-container">
    <h2>Lista de Usuarios</h2>

    <div class="users">
        <div *ngFor="let user of users" class="user-card">
            <h3>{{ user.name }}</h3>
            <p><strong>Correo:</strong> {{ user.email }}</p>
            <p><strong>Rol:</strong> {{ user.role }}</p>
        </div>
    </div>
</div>
