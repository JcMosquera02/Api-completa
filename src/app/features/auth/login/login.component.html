<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label>Correo</label>
            <input type="email" formControlName="email" placeholder="Ej: admin@helpdesk.dev" class="form-control">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" formControlName="password" placeholder="Ej: Admin123!" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
            Iniciar Sesión
        </button>
    </form>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <p>¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a></p>
</div>
