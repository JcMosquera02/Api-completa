<div class="ticket-form-container">
    <h2>{{ isEditMode ? 'Editar Ticket' : 'Crear Nuevo Ticket' }}</h2>

    <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()" class="ticket-form">
        <div class="form-group">
            <label for="title">Título</label>
            <input id="title" type="text" formControlName="title" placeholder="Ej: Problema con la impresora"
                class="form-control">
        </div>

        <div class="form-group">
            <label for="description">Descripción</label>
            <textarea id="description" formControlName="description" placeholder="Describe el problema..."
                class="form-control" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="priority">Prioridad</label>
            <select id="priority" formControlName="priority" class="form-control">
                <option value="low">Baja</option>
                <option value="medium">Media</option>
                <option value="high">Alta</option>
                <option value="urgent">Urgente</option>
            </select>
        </div>

        <div *ngIf="userRole === 'admin' || userRole === 'agent'" class="form-group">
            <label for="status">Estado</label>
            <select id="status" formControlName="status" class="form-control">
                <option value="open">Abierto</option>
                <option value="in_progress">En progreso</option>
                <option value="resolved">Resuelto</option>
                <option value="closed">Cerrado</option>
            </select>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-primary" [disabled]="ticketForm.invalid">
                {{ isEditMode ? 'Guardar Cambios' : 'Crear Ticket' }}
            </button>
            <button type="button" class="btn btn-secondary" routerLink="/tickets">
                Cancelar
            </button>
        </div>
    </form>
</div>
