<div class="ticket-list-container">
    <h2>Lista de Tickets</h2>

    <div class="create-ticket-button-container">
        <button *ngIf="userRole === 'admin' || userRole === 'client'" [routerLink]="['/tickets/new']"
            class="btn btn-primary">
            Crear Ticket
        </button>
    </div>

    <div class="filters">
        <select [(ngModel)]="filters.status" (change)="onFilterChange()" [ngModelOptions]="{standalone: true}">
            <option value="">Todos los estados</option>
            <option value="open">Abierto</option>
            <option value="in_progress">En progreso</option>
            <option value="resolved">Resuelto</option>
            <option value="closed">Cerrado</option>
        </select>

        <select [(ngModel)]="filters.priority" (change)="onFilterChange()" [ngModelOptions]="{standalone: true}">
            <option value="">Todas las prioridades</option>
            <option value="low">Baja</option>
            <option value="medium">Media</option>
            <option value="high">Alta</option>
            <option value="urgent">Urgente</option>
        </select>
    </div>

    <div *ngIf="tickets.length > 0; else noTickets" class="tickets">
        <div *ngFor="let ticket of tickets" class="ticket-card" [routerLink]="['/tickets', ticket.id]">
            <h3>{{ ticket.title }}</h3>
            <p><strong>Prioridad:</strong> {{ ticket.priority }}</p>
        </div>
    </div>

    <ng-template #noTickets>
        <p>No hay tickets para mostrar.</p>
    </ng-template>

    <div class="pagination">
        <button (click)="prevPage()" [disabled]="filters.page === 1">Anterior</button>
        <span>Página {{ filters.page }}</span>
        <button (click)="nextPage()">Siguiente</button>
    </div>
</div>
